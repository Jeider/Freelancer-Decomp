; port.ini -- settings of the port's built-in replacements for retail plugins and its language
; switch (docs/adoxa.md, docs/mod_plugins.md, docs/language.md). Read from the directory of
; freelancer.exe. Not in retail: there, each plugin was a DLL in dacom.ini [Libraries] or
; freelancer.ini [Initial SP DLLs], and a translation was a second, byte-patched exe.

[Plugins]
; 1 turns a built-in plugin on (the build needs FreelancerAdoxa = 1). Missing = off.
burn = 0             ; atmosphere_burn_<shiptype> effects
chklootvol = 0       ; NPCs skip loot that does not fit their hold
ShieldOffline = 0    ; shields stay offline while the owner has no hit points
LaneSpeed = 0        ; [Solar] lane_speed
JumpOutPt = 0        ; DATA\UNIVERSE\JumpOutPt.ini arrival points
criticalhit = 0      ; [Explosion] critical_hit
DamagePerFire = 0    ; launcher damage_per_fire wear
EquipDrag = 0        ; linear_drag on equipment
dynastex = 0         ; dynamic asteroids: hit_pts and mass
healing = 0          ; negative damage repairs (zones, munitions, explosions)
moors = 0            ; player ships use moors
storyfactions = 0    ; DATA\storyfactions.ini
dock_key = 0         ; DATA\dock_key.ini keys for locked docks
ammolimit = 0        ; ammo_limit per munition / mine / countermeasure
MatchJob = 0         ; DATA\MISSIONS\RankDiffSP.ini job difficulty by rank
MatchPlayer = 0      ; encounter levels raised to half the player's rank
callsign = 0         ; the player's call sign, [callsign] below
DisableAutoLevelToggle = 0 ; the auto-level key keeps the current state
DisableLevelCameraToggle = 0 ; the level-camera key keeps the current state
TurretZoom = 0       ; zoom / move the turret camera; optional [TurretZoom] keys
scroller = 0         ; one scroll bar for the stats and values panes
numeric = 0          ; numeric hull / shield values on the target reticle
territory = 0        ; arrival texts and Nav Map houses, [Language.*] territory_ini
NoNavMap = 0         ; DATA\UNIVERSE\NoNavMap.ini
engclass = 0         ; typed and classed engines / powerplants, [Language.*] engclass_resources
; Other mod plugins (the build needs FreelancerModPlugins = 1).
MultiCruise = 0      ; [Engine] cruise_speed, shown in the engine stats
Invisibility = 0     ; USER_CLOAK toggles the cloaking device
Interceptor = 0      ; [Gun] interceptor = true fires in cruise
PowerDamage = 0      ; [Explosion] force_energy_damage = true beats no_energy_damage
WingAnim = 0         ; use_animation_oneshot + the wing manager, [WingAnim] below

[WingAnim]
script = Sc_extend wing   ; forward folds, reverse extends
key = 0                   ; virtual-key code of the toggle key (0 = none)
modifiers = 0             ; 1 Shift | 2 Ctrl | 4 Alt

[ModServer]
; Server changes a mod made by patching server.dll (FreelancerModPlugins). Defaults = retail.
no_energy_damage = 0             ; 1: no energy (power) damage
full_explosion_hull_damage = 0   ; 1: explosions always hit the hull with the full band
view_radius_sq_scale = 1         ; scales the squared radii objects are sent to a client within
update_radius = 10000            ; the physics update sphere around each player
plain_saves = 0                  ; 1: saves stay plain text (no FLS1 encryption)
account_folder = Accts           ; the single-player save folder under the user data path

[dynastex]
collision_damage = 0   ; port extension: ramming a dynamic asteroid damages the ship

[callsign]
; What freelancer.ini's "DLL = callsign.dll, ..." passed: faction [formation [n][-][n]].
callsign = player 01 1-1

[Language]
; The active language; -lang:xx on the command line wins. Empty = retail behaviour.
language =

; One section per language. Every key is optional.
;   freelancer_ini    the client ini (retail: Freelancer.ini)
;   resources         the resource DLL (retail: resources.dll)
;   data_overlay      folders laid out like DATA (comma separated); an ini found there is read
;                     instead of the one in DATA
;   skip_any_cutscene 1 = the skip key skips every letterboxed scene
;   territory_ini     territory's ini in DATA\UNIVERSE (territory.ini); territory_codepage
;   engclass_resources engclass's string DLL (engclass.dll), loaded as data
[Language.en]
freelancer_ini = Freelancer.ini
resources = resources.dll

[Render]
fps_limit = 180                    ; frames per second cap (0 = none, -1 = the in-game setting); above ~200 FPS steering misbehaves
cockpit_shader = 1                ; scoped interior satin/clearcoat finish
cockpit_finish = 0.65             ; interior gloss strength; emissive instruments preserved
glass_shader = 1                  ; authored glass alpha pass, Fresnel and sharp highlights
glass_reflections = 1.5            ; glass reflection/gloss intensity, 0..4
surface_shaders = 1                ; per-pixel reflective profile for supported opaque envmap materials
surface_highlights = 1.35          ; overall direct gloss, 0..4
surface_clearcoat = 0.9            ; tight bright top-coat highlight, 0..3
surface_brushed = 0.8              ; broad elongated metal highlight along authored UVs, 0..3
local_shadows = 1                  ; local solar shadows, geometry and planet receivers excluded
planet_atmosphere = 1              ; per-pixel scattering shader on planet atmosphere shells (0 = retail fixed function)
atmosphere_thickness = 0.06        ; height of the glow above the limb, fraction of the planet radius
atmosphere_brightness = 0.9        ; overall brightness of glow and haze
atmosphere_haze = 0.12             ; haze at the disc centre (1 at the limb)
atmosphere_rim = 2.5               ; how fast the haze fades from the limb inwards (lower = wider band)
atmosphere_falloff = 3             ; how fast the glow fades with height
atmosphere_wrap = 0.3              ; light carried past the terminator
atmosphere_forward = 1.5           ; extra glow when looking past the planet at the sun
atmosphere_warmth = 0.5            ; sunset tint near the terminator
atmosphere_veil = 0.5              ; how much the haze hides the surface
atmosphere_exclude = sw_center,bh_,blackhole ; material name substrings that keep the retail look
planet_surface = 1                 ; one-pass planet surface shader: relief, glint on water (0 = retail passes)
planet_relief = 6                  ; relief strength from the surface texture (0 = flat)
planet_glint = 10                  ; sun glint on oceans and water worlds
planet_glint_roughness = 0.13      ; glint size (higher = wider, dimmer)
planet_glint_fresnel = 0.02        ; water reflectance looking straight down (rises to 1 at the limb)
planet_cloud_threshold = 0.45      ; brightness above which a grey texel counts as cloud (no glint, less relief)
planet_terminator_wrap = 0.05      ; light carried past the terminator
planet_detail_relief = 1           ; close-up bumps from the detail maps (rock, ice, ground)
planet_terrain_shadows = 8         ; shadows cast by ridges, longest near the terminator (0 = off)
planet_seam_blend = 0.01           ; width (uv) of the softened band where planet textures meet (0 = off)
gas_flow = 1                       ; gas giants: speed of the zonal jets (bands drifting at different speeds)
gas_turbulence = 1                 ; gas giants: strength of the swirling eddies
gas_storms = 1                     ; gas giants: great spot and white ovals (spin strength, 0 = none)
gas_swirl_planets = gasyelcld      ; gas giants that churn in vortices instead of flowing in bands (name substrings)
planet_city_lights = 0.6           ; city lights at night; the day side keeps 1 - this (0 = retail: on day and night, 1 = night only)
planet_lava_pulse = 1              ; lava glow pulses (0 = steady); it is always brighter on the night side
planet_ice_sheen = 0.6             ; soft sheen on ice
planet_airless = 1                 ; moons, Mercury-like and crater worlds lit like the Moon (flat disc, sharp terminator)
planet_eclipses = tau29_planet_2:tau29_planet_1,li_cal_planet_2:li_cal_planet_1 ; caster:receiver solar nicknames: the caster's shadow on the receiver (comma-separated pairs)
planet_eclipse_strength = 0.5      ; how much sunlight an eclipse takes (1 = all: only the system ambient is left, 0.7 keeps 30%)
planet_surface_exclude = sw_center,bh_,blackhole,neutron ; material name substrings that keep the retail look
space_layers = 0                  ; world-anchored sprite layers ([SpaceLayer] in a system ini): veils, dust, parallax stars (0 = off)
space_haze = 1                    ; world-anchored fullscreen haze at a few distances ([SpaceHaze] in a system ini; 0 = off)
far_rocks = 1                     ; asteroid fields from afar as thousands of lit rocks ([FarRocks] in a field ini; replaces the retail [Band]; 0 = off)
far_rocks_auto = 0                ; 1 = every field with a [Band] and no [FarRocks] gets a default one that replaces the band (for testing)
far_rocks_max_total = 24000       ; most far rocks drawn in a frame over all fields, the nearest field first
far_rocks_static_vb = 1           ; 1 = each field's rocks live in a static GPU vertex buffer, uploaded once (0 = sent every frame)
field_dust = 1                    ; a faint lit dust volume filling an asteroid field's zone ([FieldDust] in a field ini; 0 = off)
field_dust_auto = 0               ; 1 = every field with a [Band] and no [FieldDust] gets the default dust (for testing)
field_dust_resolution = 0.5       ; scale of the dust's march target (0.25 .. 1)
planet_rings = 1                 ; lit particle-layer shader on planet ring bands (0 = retail fixed function)
ring_brightness = 2                ; brightness of sunlight scattered by the ring
ring_backlight = 1                 ; light let through to the side facing away from the sun (0 = dark from behind)
ring_opacity = 1                   ; scales the ring's opacity (density)
ring_forward = 1.5                 ; extra glow when looking through the ring towards the sun
ring_sun_block = 1                 ; how strongly a ring dims the sun behind it, by its own density (dense bands block, gaps let light through; 0 = not at all)
ring_puff_layer = 1             ; planet ring puffs (the ring ini's [Clouds]) lie in the ring plane, dense in its bands and absent in its gaps (0 = retail: a sphere of puffs around the camera)
nebula_puff_layer = 1           ; nebula interior puffs ([Clouds]) are placed in the world, in cloud masses with gaps between them, so flying through gives parallax (0 = retail: a sphere of puffs travelling with the camera)
ring_debug = 0                    ; TEMP: 1 = each ring band piece in its own colour, and a log line per piece (shader or retail fallback)
anisotropy = 16                    ; texture minification, capped by device support
fxaa = 1                          ; edge AA: 0 off, 1 whole frame incl. HUD/wireframes, 2 space scene before HUD
windowed_gamma = 1                ; apply the game's gamma setting in windowed mode too (Direct3D 9 ignores the hardware ramp in a window)
shadow_near_resolution = 4096      ; near map: 1024/2048/4096/8192 (restart required); 7.3 cm/texel at 4096
shadow_far_resolution = 4096       ; far map and its static cache; both fall back to shadow_resolution
shadow_near_radius = 150           ; metres, high-detail region around camera
shadow_scene_radius = 5000         ; metres, outer shadow region around camera
shadow_max_length = 200            ; metres behind caster, clamped to 200; fades over last 20%
shadow_strength = 0.85             ; 0 = no darkening, 1 = full directional-light occlusion
shadow_light_angle = 2             ; angular diameter in degrees; 0 = hard, larger = softer
shadow_search_samples = 16         ; PCSS blocker search: 8..64 (64 costs ~2x as much per shadowed pixel)
shadow_filter_samples = 32         ; soft edge filtering: 16..192, four comparisons per tap (192: ~7x the cost)
shadow_bias = 0.5                  ; depth bias in world texels; lower = tighter contact
weapon_glints = 1                 ; cheap moving colour accents on opaque ships and stations
weapon_glint_groups = 8           ; maximum visible shooters; one mixed-colour accent per shooter, 1..8
weapon_glint_strength = 1.25      ; surface glow intensity, 0..4; restart required
weapon_glint_radius = 22.5          ; surface influence radius, metres, 5..100
weapon_glint_distance = 1000      ; visible camera range, hard maximum 1000 metres
shadow_adaptive_quality = 1        ; distance-based filter budget; 0 = full filter everywhere
shadow_static_quality_distance = 500 ; full filter through this surface distance, then fades to low at twice it
shadow_ship_quality_distance = 150 ; the same threshold for ships, metres
shadow_low_search_samples = 4     ; distant blocker-search taps, 2..16
shadow_low_filter_samples = 4     ; distant filter taps, four comparisons each, 2..16
shadow_static_cache_seconds = 10   ; rebuild the far map's station cache at least this often, 1..600
; NPC ships (not the player), by camera distance to the hull: full filter, a moderate fixed
; filter, a single bilinear comparison, then no shadow on or from the ship (restart required).
shadow_npc_full_distance = 100
shadow_npc_moderate_distance = 300
shadow_npc_simple_distance = 500
shadow_moderate_search_samples = 8  ; moderate tier taps, 2..64
shadow_moderate_filter_samples = 8  ; 2..192
shadow_npc_ship_length = 100       ; metres an NPC ship's shadow reaches; the player's uses shadow_max_length
; DAT_00613ec8 / original exe offset 0x213ec8: candidate range for solars/lights.
; Mesh lodranges still apply. 10000 restores the retail search radius.
solar_draw_distance = 50000
sun_field_spines = 1               ; keep spines in lanes and non-nebula asteroid fields
sun_nebula_burnthrough = 1         ; continuous nebula sunlight, respects INI burn-through intensity/size
sun_attached_effect_occlusion = 1  ; fade loadout particles with their eclipsed sun
sun_effect_fade = 0.15
sun_rays = 1
sun_ray_strength = 1.5
sun_optics_strength = 1
sun_alive = 1                      ; motion of the authored sun: spines breathe and sway, corona and glow pulse (0 = still, as retail; up to 2)
sun_corona = 1                     ; the port's light corona (solar_corona.hlsl) in place of the suns' heavy attached ALE effects (0 = the ALE, as retail)
sun_corona_strength = 0.35
sun_corona_reach = 3                ; how far the streamers reach, in disc radii (1.5..8)
sun_corona_contrast = 1.8           ; streamer contrast (0.5 soft .. 4 sharp)
sun_nebula_halo = 0.12
; The sun always glows through nebulae: a round halo drawn over the nebula composite (star_sphere.cpp StarSphereDrawNebulaHalo).
sun_blocked_halo = 0.5             ; its strength (a volumetric.ini style may override it with sun_nebula_halo)
sun_blocked_halo_size = 1          ; its size, as a fraction of the star glow sprite
sun_burnthrough_gain = 2          ; the sun's halo through a nebula: the nebula's sun_burnthrough_intensity times this (capped at 1)
sun_burnthrough_size_gain = 1.5     ; its size: the nebula's sun_burnthrough_scaler times this
sun_nebula_fade_seconds = 3      ; leaving a nebula the sun comes back over up to this many seconds (0 = at once)
sun_halo_floor = 0.25             ; the halo never drops below this fraction of its strength, however much nebula lies toward the sun
; The player's ship in the haze: a soft glow of the ship's lights scattering in the dust, while inside a nebula.
ship_haze_aura = 0                 ; strength (0 = off; a style may override it with ship_haze_aura)
ship_haze_aura_size = 2.5          ; half size in ship radii
equipment_lights = 1               ; real equipment point/cone sources on NPCs and solars too
weapon_lights = 0                  ; light_anim flashes outside the player's cockpit as well
; Camera-relative modelview (FREELANCER_PRECISE_RENDER, docs/precise_render.md): ships and
; stations far from the system centre stop shaking.
precise_view = 0
; Particle improvements (FREELANCER_PARTICLE_FX, docs/particle_fx.md; soft particles need RP9 / Direct3D 9).
soft_particles_effects = 0   ; metres over which explosions / fire / smoke fade into surfaces (0 = off)
soft_particles_clouds = 0    ; the same for nebula puffs
cloud_sort = 0               ; nebula puffs drawn back to front
cloud_smooth_fade = 0        ; smooth (smoothstep) puff fades instead of linear
cloud_inside_only = 0         ; nebula puffs only while the camera is inside the nebula zone
puff_shadow_floor = 0.2       ; share of its colour a ring / nebula puff keeps inside a planet's shadow (1 = no shadow)
billboard_shadow_floor = 0.15 ; the same for the distant asteroid billboard rocks
dynamic_asteroid_shadow_floor = 0.15 ; direct light left on a dynamic asteroid inside a planet's or ring's shadow
puff_rotation_step = 90       ; each puff turned by a fixed multiple of this many degrees (90: 0/90/180/270; 0 = use puff_rotation_range)
puff_rotation_range = 0       ; with step 0: each puff turned by a stable random angle within +- this many degrees

[Debug]
crash_dumps = 1                    ; on a crash write CRASHDUMPS\freelancer_<date>_<time>.dmp (with heap) and .txt (call stack)
crash_dumps_keep = 5               ; how many crash dumps to keep (oldest deleted first)
hang_dump_seconds = 30             ; write a dump + main-thread stack when the game stops drawing frames this long (0 = off)

[Window]
background_run = 1                 ; a windowed game keeps running and drawing without the focus (fullscreen still pauses)
