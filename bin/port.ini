; port.ini -- settings of the port's built-in replacements for retail plugins and its language
; switch (docs/adoxa.md, docs/mod_plugins.md, docs/language.md). Read from the directory of
; freelancer.exe. Not in retail: there, each plugin was a DLL in dacom.ini [Libraries] or
; freelancer.ini [Initial SP DLLs], and a translation was a second, byte-patched exe.

[Plugins]
; 1 turns a built-in plugin on (the build needs FreelancerAdoxa = 1). Missing = off.
burn = 0             ; atmosphere_burn_<shiptype> effects
chklootvol = 0       ; NPCs skip loot that does not fit their hold
ShieldOffline = 0    ; shields stay offline while the owner has no hit points
LaneSpeed = 0        ; [Solar] lane_speed
JumpOutPt = 0        ; DATA\UNIVERSE\JumpOutPt.ini arrival points
criticalhit = 0      ; [Explosion] critical_hit
DamagePerFire = 0    ; launcher damage_per_fire wear
EquipDrag = 0        ; linear_drag on equipment
dynastex = 0         ; dynamic asteroids: hit_pts and mass
healing = 0          ; negative damage repairs (zones, munitions, explosions)
moors = 0            ; player ships use moors
storyfactions = 0    ; DATA\storyfactions.ini
dock_key = 0         ; DATA\dock_key.ini keys for locked docks
ammolimit = 0        ; ammo_limit per munition / mine / countermeasure
MatchJob = 0         ; DATA\MISSIONS\RankDiffSP.ini job difficulty by rank
MatchPlayer = 0      ; encounter levels raised to half the player's rank
callsign = 0         ; the player's call sign, [callsign] below
DisableAutoLevelToggle = 0 ; the auto-level key keeps the current state
DisableLevelCameraToggle = 0 ; the level-camera key keeps the current state
TurretZoom = 0       ; zoom / move the turret camera; optional [TurretZoom] keys
scroller = 0         ; one scroll bar for the stats and values panes
numeric = 0          ; numeric hull / shield values on the target reticle
territory = 0        ; arrival texts and Nav Map houses, [Language.*] territory_ini
NoNavMap = 0         ; DATA\UNIVERSE\NoNavMap.ini
engclass = 0         ; typed and classed engines / powerplants, [Language.*] engclass_resources
; Other mod plugins (the build needs FreelancerModPlugins = 1).
MultiCruise = 0      ; [Engine] cruise_speed, shown in the engine stats
Invisibility = 0     ; USER_CLOAK toggles the cloaking device
Interceptor = 0      ; [Gun] interceptor = true fires in cruise
PowerDamage = 0      ; [Explosion] force_energy_damage = true beats no_energy_damage
WingAnim = 0         ; use_animation_oneshot + the wing manager, [WingAnim] below

[WingAnim]
script = Sc_extend wing   ; forward folds, reverse extends
key = 0                   ; virtual-key code of the toggle key (0 = none)
modifiers = 0             ; 1 Shift | 2 Ctrl | 4 Alt

[ModServer]
; Server changes a mod made by patching server.dll (FreelancerModPlugins). Defaults = retail.
no_energy_damage = 0             ; 1: no energy (power) damage
full_explosion_hull_damage = 0   ; 1: explosions always hit the hull with the full band
view_radius_sq_scale = 1         ; scales the squared radii objects are sent to a client within
update_radius = 10000            ; the physics update sphere around each player
plain_saves = 0                  ; 1: saves stay plain text (no FLS1 encryption)
account_folder = Accts           ; the single-player save folder under the user data path

[dynastex]
collision_damage = 0   ; port extension: ramming a dynamic asteroid damages the ship

[callsign]
; What freelancer.ini's "DLL = callsign.dll, ..." passed: faction [formation [n][-][n]].
callsign = player 01 1-1

[Language]
; The active language; -lang:xx on the command line wins. Empty = retail behaviour.
language =

; One section per language. Every key is optional.
;   freelancer_ini    the client ini (retail: Freelancer.ini)
;   resources         the resource DLL (retail: resources.dll)
;   data_overlay      folders laid out like DATA (comma separated); an ini found there is read
;                     instead of the one in DATA
;   skip_any_cutscene 1 = the skip key skips every letterboxed scene
;   territory_ini     territory's ini in DATA\UNIVERSE (territory.ini); territory_codepage
;   engclass_resources engclass's string DLL (engclass.dll), loaded as data
[Language.en]
freelancer_ini = Freelancer.ini
resources = resources.dll

[Render]
cockpit_shader = 1                ; scoped interior satin/clearcoat finish
cockpit_finish = 0.65             ; interior gloss strength; emissive instruments preserved
glass_shader = 1                  ; authored glass alpha pass, Fresnel and sharp highlights
glass_reflections = 1.5            ; glass reflection/gloss intensity, 0..4
surface_shaders = 1                ; per-pixel reflective profile for supported opaque envmap materials
surface_highlights = 1.35          ; overall direct gloss, 0..4
surface_clearcoat = 0.9            ; tight bright top-coat highlight, 0..3
surface_brushed = 0.8              ; broad elongated metal highlight along authored UVs, 0..3
local_shadows = 1                  ; local solar shadows, geometry and planet receivers excluded
anisotropy = 16                    ; texture minification, capped by device support
fxaa = 1                          ; scene edge AA before HUD, retains INTZ depth
shadow_resolution = 8192           ; per map: 1024/2048/4096/8192 (restart required)
shadow_near_radius = 150           ; metres, high-detail region around camera (3.7 cm/texel at 8192)
shadow_scene_radius = 5000         ; metres, outer shadow region around camera
shadow_max_length = 200            ; metres behind caster, clamped to 200; fades over last 20%
shadow_strength = 0.85             ; 0 = no darkening, 1 = full directional-light occlusion
shadow_light_angle = 2             ; angular diameter in degrees; 0 = hard, larger = softer
shadow_search_samples = 64         ; PCSS blocker search: 8..64
shadow_filter_samples = 192        ; soft edge filtering: 16..192, four comparisons per tap
shadow_bias = 0.5                  ; depth bias in world texels; lower = tighter contact
weapon_glints = 1                 ; cheap moving colour accents on opaque ships and stations
weapon_glint_groups = 8           ; maximum visible shooters; one mixed-colour accent per shooter, 1..8
weapon_glint_strength = 1.25      ; surface glow intensity, 0..4; restart required
weapon_glint_radius = 22.5          ; surface influence radius, metres, 5..100
weapon_glint_distance = 1000      ; visible camera range, hard maximum 1000 metres
shadow_adaptive_quality = 1        ; distance-based filter budget; 0 = full filter everywhere
shadow_static_quality_distance = 500 ; full filter through this surface distance, then fades to low at twice it
shadow_ship_quality_distance = 150 ; the same threshold for ships, metres
shadow_low_search_samples = 4     ; distant blocker-search taps, 2..16
shadow_low_filter_samples = 4     ; distant filter taps, four comparisons each, 2..16
; DAT_00613ec8 / original exe offset 0x213ec8: candidate range for solars/lights.
; Mesh lodranges still apply. 10000 restores the retail search radius.
solar_draw_distance = 50000
sun_field_spines = 1               ; keep spines in lanes and non-nebula asteroid fields
sun_nebula_burnthrough = 1         ; continuous nebula sunlight, respects INI burn-through intensity/size
sun_attached_effect_occlusion = 1  ; fade loadout particles with their eclipsed sun
sun_effect_fade = 0.15
sun_rays = 1
sun_ray_strength = 1.5
sun_optics_strength = 0.5
sun_nebula_halo = 0.12
equipment_lights = 1               ; real equipment point/cone sources on NPCs and solars too
weapon_lights = 0                  ; light_anim flashes outside the player's cockpit as well
; Camera-relative modelview (FREELANCER_PRECISE_RENDER, docs/precise_render.md): ships and
; stations far from the system centre stop shaking.
precise_view = 0
; Particle improvements (FREELANCER_PARTICLE_FX, docs/particle_fx.md; soft particles need RP9 / Direct3D 9).
soft_particles_effects = 0   ; metres over which explosions / fire / smoke fade into surfaces (0 = off)
soft_particles_clouds = 0    ; the same for nebula puffs
cloud_sort = 0               ; nebula puffs drawn back to front
cloud_smooth_fade = 0        ; smooth (smoothstep) puff fades instead of linear
cloud_inside_only = 0         ; nebula puffs only while the camera is inside the nebula zone
