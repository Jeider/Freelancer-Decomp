[NebulaStyle]
name = walker
; Retail lightning: the backdrop flash (its [BackgroundLightning] gap) and the light on ships.
lightning_enabled = 0
; TEMP minimum-cost (as edge); was: resolution_scale (default), step_count 128, shadow_steps 6, puff_texture_density 0.45, puff_texture_colour 0.55, ms_strength 0.3
resolution_scale = 0.35
; Walker: sand and dust, not vapour. Layered, streaked banks drawn out by a flow instead of round
; cumulus; a dusty haze between them; the sun shines through the dust (forward scattering), the
; texture's warm grain shows in the volume. Distances and the entry behaviour follow crow.
real_background = 1
step_count = 56
step_distribution = 1.4
density_scale = 0.8
; Shared li_cal haze with a long gradual ramp.
